name: Cloudflare Auto SpeedTest & Push

on:
  schedule:
    # 每 6 小时自动运行一次 (UTC 00:00, 06:00, 12:00, 18:00 -> 北京时间 08:00, 14:00, 20:00, 02:00)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持在 GitHub 界面手动触发执行

jobs:
  speedtest:
    name: Cloudflare SpeedTest & Auto Upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'yx-tools/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Cloudflare SpeedTest and Upload to cfnew Worker
        env:
          WORKER_DOMAIN: ${{ secrets.WORKER_DOMAIN }}
          WORKER_UUID: ${{ secrets.WORKER_UUID }}
        run: |
          if [ -z "$WORKER_DOMAIN" ] || [ -z "$WORKER_UUID" ]; then
            echo "❌ Error: WORKER_DOMAIN or WORKER_UUID repository secret is not set!"
            echo "Please configure WORKER_DOMAIN and WORKER_UUID in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "🚀 Starting Cloudflare SpeedTest..."
          python3 cloudflare_speedtest.py \
            --mode beginner \
            --count 10 \
            --speed 1.0 \
            --delay 1000 \
            --upload api \
            --worker-domain "$WORKER_DOMAIN" \
            --uuid "$WORKER_UUID" \
            --clear \
            --probe
